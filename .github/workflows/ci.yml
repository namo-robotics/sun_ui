name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build development image
        run: docker build -t sun-ui-dev .
      - name: Build and test without sun_gobject
        # Make the runner's UID and GID resolvable inside the container.
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -v /etc/passwd:/etc/passwd:ro
          -v /etc/group:/etc/group:ro
          -e XDG_DATA_HOME=/workspaces/sun_ui/tmp/ci/data
          -e XDG_CACHE_HOME=/workspaces/sun_ui/tmp/ci/cache
          -e XDG_CONFIG_HOME=/workspaces/sun_ui/tmp/ci/config
          -v "$PWD:/workspaces/sun_ui" sun-ui-dev
          bash -c 'mkdir -p "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" && ./build.sh && sun fmt --check src/ui.sun src/styles.sun src/markup src/drawing.sun src/plot src/graphics src/adapters src/tools examples tests'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-tests
          path: |
            build/sun-version.txt
            build/test-results.log
            build/markup-test-results.log
            build/scientific-plot.svg
  gtk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build development image
        run: docker build -t sun-ui-dev .
      - name: Build dependency and run native acceptance tests
        # Keep SSH in the development manifest; fetch the public dependency over HTTPS in CI.
        # D-Bus needs a passwd entry for the runner's UID inside the container.
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -v /etc/passwd:/etc/passwd:ro
          -v /etc/group:/etc/group:ro
          -e XDG_DATA_HOME=/workspaces/sun_ui/tmp/ci/data
          -e XDG_CACHE_HOME=/workspaces/sun_ui/tmp/ci/cache
          -e XDG_CONFIG_HOME=/workspaces/sun_ui/tmp/ci/config
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=url.https://github.com/namo-robotics/sun_gobject.git.insteadOf
          -e GIT_CONFIG_VALUE_0=git@github.com:namo-robotics/sun_gobject.git
          -v "$PWD:/workspaces/sun_ui" sun-ui-dev
          bash -o pipefail -c 'mkdir -p "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" && bash scripts/import-ci-dependencies.sh && bash scripts/build-ci-dependency.sh && ./build.sh --gtk'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtk-tests
          path: |
            src/sun_gobject/build/test-results.log
            build/sun-version.txt
            build/test-results.log
            build/markup-test-results.log
            build/gtk-test-results.log
      - name: Package Linux development tools and bundles
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspaces/sun_ui" sun-ui-dev sun src/tools/package.sun
      - name: Upload development bundles
        uses: actions/upload-artifact@v4
        with:
          name: dev-bundles
          if-no-files-found: error
          path: |
            build/sun-ui_0.dev_amd64.deb
            build/sun_ui.moon
            build/sun_plot.moon
            build/sun_ui_gtk.moon
            build/sun_ui_gtk_drawing.moon
            build/sun-version.txt
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and GTK dependencies
        run: brew install namo-robotics/sun/sun gtk4 sdl3 libepoxy librsvg gstreamer coreutils cmake ninja pkgconf gobject-introspection
      - name: Import and build GTK dependency
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: 'git@github.com:'
        run: |
          python3 -m venv .toolchain/vcs
          .toolchain/vcs/bin/pip install vcs2l==1.1.7
          PATH="$PWD/.toolchain/vcs/bin:$PATH" bash scripts/import-ci-dependencies.sh
          ./src/sun_gobject/scripts/build-macos.sh
      - name: Build and test native bundles
        run: ./scripts/build-macos.sh
      - name: Build and test GTK and SDL graphics integration
        run: ./build.sh --graphics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphics-macos-tests
          path: build/graphics-test-results.log
      - uses: actions/upload-artifact@v4
        with:
          name: graphics-macos-bundles
          path: |
            build/sun_ui_graphics*.moon
            build/sun_ui_sdl.moon
            build/graphics-native/libsun_ui_graphics.a
            build/graphics-native/libsun_ui_sdl.a
      - uses: actions/upload-artifact@v4
        with:
          name: sun_ui-macos-arm64
          if-no-files-found: error
          path: build/sun_ui-arm64-apple-darwin.tar.gz
  graphics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build development image
        run: docker build -t sun-ui-dev .
      - name: Build dependency and exercise public graphics APIs
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -v /etc/passwd:/etc/passwd:ro -v /etc/group:/etc/group:ro
          -e XDG_DATA_HOME=/workspaces/sun_ui/tmp/ci/data
          -e XDG_CACHE_HOME=/workspaces/sun_ui/tmp/ci/cache
          -e XDG_CONFIG_HOME=/workspaces/sun_ui/tmp/ci/config
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=url.https://github.com/namo-robotics/sun_gobject.git.insteadOf
          -e GIT_CONFIG_VALUE_0=git@github.com:namo-robotics/sun_gobject.git
          -v "$PWD:/workspaces/sun_ui" sun-ui-dev
          bash -o pipefail -c 'mkdir -p "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" && bash scripts/import-ci-dependencies.sh && bash scripts/build-ci-dependency.sh && ./build.sh --graphics'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphics-linux-tests
          path: build/graphics-test-results.log
      - uses: actions/upload-artifact@v4
        with:
          name: graphics-linux-bundles
          path: |
            build/sun_ui_graphics*.moon
            build/sun_ui_sdl.moon
            build/graphics-native/libsun_ui_graphics.a
            build/graphics-native/libsun_ui_sdl.a
  publish-dev:
    needs: [core, gtk, macos, graphics]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested bundles
        uses: actions/download-artifact@v4
        with:
          name: dev-bundles
          path: build/release
      - name: Download tested macOS bundles
        uses: actions/download-artifact@v4
        with:
          name: sun_ui-macos-arm64
          path: build/release
      - name: Update dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          target_commitish: ${{ github.sha }}
          name: Development Build
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            build/release/*.deb
            build/release/*.moon
            build/release/sun-version.txt
            build/release/sun_ui-arm64-apple-darwin.tar.gz
          body: |
            Latest development build from main branch.

            Commit: ${{ github.sha }}

            Sun bundles for x86_64 Linux (Ubuntu 26.04) and Apple Silicon macOS.
            The .moon assets and sun-version.txt are the Linux build.
            The macOS archive contains its own bundles, tools, and compiler version.
            Use the matching compiler and native dependencies for each platform,
            and place the bundles in a directory passed to Sun with --lib-path.

            sun_ui.moon and sun_plot.moon do not require GTK.
            The optional GTK bundles also require compatible sun_gobject.moon,
            sun_gtk.moon, the sun_gobject native archive, GTK 4, and librsvg.
